<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Finder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="card" x1="120" y1="150" x2="330" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <!-- rounded app badge -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- stacked cards: projects over sessions -->
  <rect x="112" y="150" width="196" height="150" rx="26" fill="#ffffff" opacity="0.28"/>
  <rect x="96" y="186" width="212" height="158" rx="28" fill="url(#card)"/>
  <rect x="128" y="224" width="120" height="16" rx="8" fill="#6366f1" opacity="0.85"/>
  <rect x="128" y="258" width="150" height="12" rx="6" fill="#64748b" opacity="0.55"/>
  <rect x="128" y="286" width="96" height="12" rx="6" fill="#64748b" opacity="0.45"/>

  <!-- magnifying glass -->
  <circle cx="330" cy="316" r="82" fill="#ffffff"/>
  <circle cx="330" cy="316" r="82" stroke="#4f46e5" stroke-width="22" fill="none"/>
  <circle cx="330" cy="316" r="44" fill="#a855f7" opacity="0.35"/>
  <rect x="384" y="368" width="96" height="34" rx="17" transform="rotate(45 384 368)" fill="#ffffff"/>
  <rect x="388" y="372" width="86" height="24" rx="12" transform="rotate(45 388 372)" fill="#4f46e5"/>
</svg>
